# EvalScope 模型评测 + 对比报告 配置模板
#
# 每个 `models` 条目 = 一个 (模型 × 厂商)。url / api_key 为明文，请勿纳入版本控制。
# 跑一个条目会依次执行 4 条命令：
#   1. cmmlu（知识评测）
#   2. humaneval_plus（代码评测，Docker sandbox）
#   3. longalpaca（单轮长文本性能压测，evalscope perf）
#   4. swe（SWE-Smith 多轮会话缓存压测，evalscope perf）
#
# 字段说明：
#   model    : 模型名，同时作为 --model 与 model_id 的组成部分
#   vendor   : 厂商后缀，model_id = "<model>_<vendor>"（用于 --model-id / --name / 目录名）
#   label    : 报告里"部署方式/厂商"的显示名（如 腾讯云 / 阿里云-矩云科技）
#   url      : 兼容 OpenAI 的 chat/completions 端点
#   api_key  : 该端点的 API Key

defaults:
  cmmlu:
    limit: null                 # null/省略 = 全量跑；填 50 做快速冒烟
    eval_batch_size: 8
    generation_config:
      temperature: 0
      top_p: 0.95
      max_tokens: 16384
      seed: 42
      extra_body:
        thinking:
          type: disabled
  humaneval_plus:
    eval_batch_size: 4
    sandbox:
      enabled: true
      engine: docker
    dataset_args:
      humaneval_plus:
        review_timeout: 60
    generation_config:
      timeout: 600
      max_tokens: 16384
      temperature: 0
      top_p: 0.95
      extra_body:
        reasoning_effort: low
        # max_completion_tokens: 16384   # 可选：连 reasoning 一起限长（取消注释这行，并注释掉上面的 max_tokens）
  longalpaca:
    dataset_offset: 500
    max_tokens: 512
    # max_completion_tokens: 512    # 推理模型可选：连 reasoning 一起限长（二选一）
    parallel: [1, 8, 16]
    number: [20, 80, 160]
    temperature: 0
    top_p: 1.0
    extra_args:
      reasoning_effort: low
    stream: true
    warmup_num: 2
    read_timeout: 300
  swe:
    dataset: swe_smith
    dataset_path: auto          # auto = dataset_offset==0 用 outputs/agentic_dataset.json，否则 outputs/agentic_pool.json；也可写死具体文件
    dataset_offset: 10
    multi_turn: true
    parallel: 5
    number: 10
    max_tokens: 16384
    # max_completion_tokens: 16384   # 推理模型可选：连 reasoning+content 一起限长（取消注释这行，并注释掉上面的 max_tokens，二选一）
    seed: 42
    temperature: 1.0
    top_p: 0.95
    stream: true
    extra_args:
      reasoning_effort: low
    read_timeout: 300
    no_test_connection: true
    session_cache: off          # on → 加 --multi-turn-session-cache；off → 省略

models:
  - model: glm-5.2
    vendor: tencent
    label: 腾讯云
    url: https://tokenhub.tencentmaas.com/v1/chat/completions
    api_key: sk-xxxx

  - model: glm-5.2
    vendor: aliyun-juyunkeji
    label: 阿里云-矩云科技
    url: https://ws-fv27qx1qcocc0gpl.cn-beijing.maas.aliyuncs.com/compatible-mode/v1/chat/completions
    api_key: sk-yyyy
