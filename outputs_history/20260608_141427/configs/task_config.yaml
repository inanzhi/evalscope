dataset_args:
  humaneval_plus:
    aggregation: mean_and_pass_at_k
    data_statistics: null
    dataset_id: evalscope/humanevalplus
    default_subset: default
    description: '

      ## Overview


      HumanEval Plus is a rigorous extension of OpenAI''s HumanEval benchmark, designed
      to address high false-positive rates in code generation evaluation. It augments
      the original test cases with tens of thousands of automatically generated inputs
      to expose edge-case bugs and functional errors.


      ## Task Description


      - **Task Type**: Code Generation (Python)

      - **Input**: Function signature with docstring describing expected behavior

      - **Output**: Complete Python function implementation

      - **Test Coverage**: Massively expanded compared to original HumanEval


      ## Key Features


      - 164 problems from original HumanEval with enhanced test suites

      - Tens of thousands of additional test cases per problem

      - LLM-based and mutation-based test input generation

      - Exposes edge cases and bugs missed by original HumanEval

      - Much stricter and more accurate correctness evaluation


      ## Evaluation Notes


      - Default configuration uses **0-shot** evaluation

      - **Security Warning**: By default, code is executed in the local environment.
      We strongly recommend using sandbox execution. See the [sandbox documentation](https://evalscope.readthedocs.io/en/latest/user_guides/sandbox.html)
      for details.

      - Supports `pass@k` metric calculation

      - Default timeout is 300 seconds to accommodate extensive test suites

      - Uses custom Docker image with numpy pre-installed

      '
    eval_split: test
    extra_params: {}
    few_shot_num: 0
    few_shot_prompt_template: null
    few_shot_random: false
    filters: null
    force_redownload: false
    max_image_bytes: null
    metric_list:
    - acc
    name: humaneval_plus
    output_types:
    - generation
    paper_url: null
    pretty_name: HumanEvalPlus
    prompt_template: 'Read the following function signature and docstring, and fully
